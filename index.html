<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>repozz | Jogos Grátis Online</title>
    <style>
        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --primary: #00ff88;
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Topo do Site */
        header {
            background-color: var(--surface);
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            border-bottom: 2px solid #334155;
        }

        .logo {
            font-size: 32px;
            font-weight: 900;
            letter-spacing: -1.5px;
            color: var(--text);
            text-transform: lowercase;
            cursor: pointer;
        }

        .logo span {
            color: var(--primary);
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }

        /* Container do Grid de Jogos (Estilo Poki) */
        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
            flex-grow: 1;
        }

        .section-title {
            font-size: 20px;
            color: var(--text-muted);
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .grid-poki {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        /* Cards de Jogo */
        .game-card {
            background-color: var(--surface);
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 2px solid transparent;
            display: flex;
            flex-direction: column;
            aspect-ratio: 1 / 1;
            position: relative;
        }

        .game-card:hover {
            transform: translateY(-8px);
            border-color: var(--primary);
            box-shadow: 0 10px 20px rgba(0, 255, 136, 0.15);
        }

        .game-thumb {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 64px;
            background: linear-gradient(135deg, #1e293b, #334155);
        }

        /* Cores customizadas para cada card */
        .card-snake .game-thumb { background: linear-gradient(135deg, #115e59, #134e4a); }
        .card-damas .game-thumb { background: linear-gradient(135deg, #991b1b, #7f1d1d); }
        .card-xadrez .game-thumb { background: linear-gradient(135deg, #374151, #1f2937); }

        .game-info {
            padding: 12px;
            background-color: rgba(0,0,0,0.2);
            font-weight: 600;
            text-align: center;
            font-size: 16px;
        }

        /* Tela de Jogo (Modo Teatro) */
        #theater-mode {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(15, 23, 42, 0.98);
            z-index: 1000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .btn-back {
            position: absolute;
            top: 20px;
            left: 20px;
            background-color: var(--surface);
            color: #fff;
            border: 2px solid #334155;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: 0.2s;
        }

        .btn-back:hover {
            border-color: #ef4444;
            color: #ef4444;
        }

        .game-frame {
            background-color: #171721;
            padding: 20px;
            border-radius: 16px;
            border: 1px solid #334155;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 100%;
        }

        /* --- Estilos internos dos jogos --- */
        .status-txt { margin-bottom: 15px; font-weight: bold; color: var(--primary); font-size: 18px; }
        canvas { background-color: #000; border: 3px solid #334155; border-radius: 8px; max-width: 100%; height: auto; }
        .snake-ctrls { display: grid; grid-template-columns: repeat(3, 55px); grid-template-rows: repeat(3, 55px); gap: 8px; margin-top: 15px; }
        .s-btn { background: #334155; color: #fff; border: 1px solid var(--primary); border-radius: 50%; font-size: 18px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        #s-up { grid-column: 2; grid-row: 1; } #s-left { grid-column: 1; grid-row: 2; } #s-right { grid-column: 3; grid-row: 2; } #s-down { grid-column: 2; grid-row: 3; }
        .board { display: grid; grid-template-columns: repeat(8, 45px); grid-template-rows: repeat(8, 45px); border: 4px solid #1e293b; background-color: #222; }
        @media (max-width: 450px) { .board { grid-template-columns: repeat(8, 35px); grid-template-rows: repeat(8, 35px); } }
        .square { display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; }
        .light { background-color: #e2e4e6; color: #000; } .dark { background-color: #4b5563; color: #fff; } .selected { background-color: #00ff88 !important; }
        .piece-checker { width: 75%; height: 75%; border-radius: 50%; border: 2px solid white; box-sizing: border-box; }
        .piece-checker.red { background-color: #ef4444; } .piece-checker.black { background-color: #0f172a; border-color: #4b5563; }
    </style>
</head>
<body>

    <header>
        <div class="logo" onclick="closeGame()">repozz<span>.</span></div>
    </header>

    <!-- LOBBY PRINCIPAL ESTILO POKI -->
    <div class="container" id="lobby-container">
        <div class="section-title">Jogos Populares</div>
        <div class="grid-poki">
            
            <!-- Card Cobrinha -->
            <div class="game-card card-snake" onclick="openGame('snake')">
                <div class="game-thumb">🐍</div>
                <div class="game-info">Jogo da Cobrinha</div>
            </div>

            <!-- Card Damas -->
            <div class="game-card card-damas" onclick="openGame('damas')">
                <div class="game-thumb">🔴</div>
                <div class="game-info">Damas Clássico</div>
            </div>

            <!-- Card Xadrez -->
            <div class="game-card card-xadrez" onclick="openGame('xadrez')">
                <div class="game-thumb">👑</div>
                <div class="game-info">Xadrez Pro</div>
            </div>

        </div>
    </div>

    <!-- MODO TEATRO PARA RODAR OS JOGOS -->
    <div id="theater-mode">
        <button class="btn-back" onclick="closeGame()">← Voltar para o Lobby</button>
        
        <div class="game-frame">
            <!-- Espaço do Jogo da Cobrinha -->
            <div id="play-snake" style="display:none; flex-direction:column; align-items:center;">
                <div class="status-txt">Pontos: <span id="snake-score">0</span></div>
                <canvas id="snakeCanvas" width="360" height="360"></canvas>
                <div class="snake-ctrls">
                    <button class="s-btn" id="s-up">↑</button>
                    <button class="s-btn" id="s-left">←</button>
                    <button class="s-btn" id="s-right">→</button>
                    <button class="s-btn" id="s-down">↓</button>
                </div>
            </div>

            <!-- Espaço do Jogo de Damas -->
            <div id="play-damas" style="display:none; flex-direction:column; align-items:center;">
                <div class="status-txt" id="damas-status">Vez das Vermelhas</div>
                <div id="damasBoard" class="board"></div>
            </div>

            <!-- Espaço do Jogo de Xadrez -->
            <div id="play-xadrez" style="display:none; flex-direction:column; align-items:center;">
                <div class="status-txt" id="xadrez-status">Vez das Brancas</div>
                <div id="xadrezBoard" class="board"></div>
            </div>
        </div>
    </div>

    <script>
        // --- GERENCIADOR DO MODO TEATRO ---
        function openGame(gameId) {
            document.getElementById('lobby-container').style.display = 'none';
            document.getElementById('theater-mode').style.display = 'flex';
            
            // Esconde todas as telas internas de jogos
            ['snake', 'damas', 'xadrez'].forEach(id => {
                document.getElementById(`play-${id}`).style.display = 'none';
            });

            // Mostra o jogo escolhido e inicializa
            document.getElementById(`play-${gameId}`).style.display = 'flex';

            if(gameId === 'snake') resetSnake();
            if(gameId === 'damas') initDamas();
            if(gameId === 'xadrez') initXadrez();
        }

        function closeGame() {
            clearInterval(sInterval); // Para o loop da cobrinha
            document.getElementById('theater-mode').style.display = 'none';
            document.getElementById('lobby-container').style.display = 'block';
        }

        // --- ENGINES DOS JOGOS (MANTIDOS E AJUSTADOS) ---
        // 1. COBRINHA
        const sCanvas = document.getElementById("snakeCanvas");
