<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Bloco de Notas</title>
    <style>
        /* Estilo visual do site (Tema Escuro) */
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
        }

        h1 {
            margin-bottom: 10px;
            font-size: 24px;
            color: #00ff88;
        }

        p {
            margin: 0 0 20px 0;
            color: #888888;
            font-size: 14px;
        }

        /* Estilo da área de texto */
        textarea {
            width: 100%;
            max-width: 800px;
            flex-grow: 1;
            background-color: #1e1e1e;
            color: #ffffff;
            border: 1px solid #333333;
            border-radius: 8px;
            padding: 15px;
            font-size: 16px;
            line-height: 1.5;
            resize: none;
            outline: none;
            box-sizing: border-box;
        }

        /* Efeito de brilho ao clicar no bloco de notas */
        textarea:focus {
            border-color: #00ff88;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.2);
        }
    </style>
</head>
<body>

    <h1>📝 Bloco de Notas Local</h1>
    <p>O que você digitar aqui será salvo automaticamente no seu navegador.</p>

    <!-- Área onde o usuário digita -->
    <textarea id="notepad" placeholder="Comece a digitar suas notas aqui..."></textarea>

    <script>
        // Seleciona o campo de texto
        const notepad = document.getElementById('notepad');

        // 1. Carrega o texto salvo assim que a página abre
        window.onload = () => {
            const savedText = localStorage.getItem('myValueText');
            if (savedText) {
                notepad.value = savedText;
            }
        };

        // 2. Salva o texto automaticamente a cada letra digitada
        notepad.addEventListener('input', () => {
            localStorage.setItem('myValueText', notepad.value);
        });
    </script>

</body>
</html>
