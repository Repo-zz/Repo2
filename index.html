<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>repozz | Arcade Portal</title>
    <style>
        :root {
            --primary: #00ff88;
            --bg: #0d0d13;
            --surface: #171721;
            --text: #ffffff;
            --text-secondary: #8b8b9c;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* Logo Tipo repozz */
        header {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo {
            font-size: 48px;
            font-weight: 900;
            letter-spacing: -2px;
            color: var(--text);
            text-transform: lowercase;
            position: relative;
            display: inline-block;
        }

        .logo::after {
            content: 'z';
            color: var(--primary);
            position: absolute;
            right: -2px;
            text-shadow: 0 0 15px rgba(0, 255, 136, 0.6);
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 5px;
        }

        /* Menu do Lobby */
        .lobby {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .lobby-btn {
            background-color: var(--surface);
            color: var(--text);
            border: 2px solid #262636;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .lobby-btn:hover {
            border-color: var(--primary);
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.2);
        }

        .lobby-btn.active {
            background-color: var(--primary);
            color: #000;
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.4);
        }

        /* Container dos Jogos */
        .game-stage {
            background-color: var(--surface);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #262636;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 100%;
            box-sizing: border-box;
        }

        .game-window {
            display: none;
            flex-direction: column;
            align-items: center;
        }

        .game-window.active {
            display: flex;
        }

        /* --- Estilos do Tabuleiro (Damas e Xadrez) --- */
        .board {
            display: grid;
            grid-template-columns: repeat(8, 45px);
            grid-template-rows: repeat(8, 45px);
            border: 4px solid #1a1a24;
            background-color: #222;
        }
        @media (max-width: 450px) {
            .board {
                grid-template-columns: repeat(8, 35px);
                grid-template-rows: repeat(8, 35px);
            }
        }

        .square {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            position: relative;
        }

        .light { background-color: #e2e4e6; color: #000; }
        .dark { background-color: #3b3e46; color: #fff; }
        .selected { background-color: #7fffd4 !important; }

        /* Peças de Damas */
        .piece-checker {
            width: 75%;
            height: 75%;
            border-radius: 50%;
            box-sizing: border-box;
            border: 2px solid white;
        }
        .piece-checker.red { background-color: #ef4444; border-color: #fff; }
        .piece-checker.black { background-color: #1f2937; border-color: #4b5563; }
        .piece-checker.dama { border: 4px double #ffd700; }

        /* --- Estilos da Cobrinha --- */
        canvas {
            background-color: #000;
            border: 2px solid #333;
            max-width: 100%;
            height: auto;
        }
        .snake-ctrls {
            display: grid;
            grid-template-columns: repeat(3, 60px);
            grid-template-rows: repeat(3, 60px);
            gap: 8px;
            margin-top: 15px;
        }
        .s-btn {
            background: #222; color: #fff; border: 1px solid var(--primary);
            border-radius: 50%; font-size: 20px; display: flex;
            align-items: center; justify-content: center; cursor: pointer;
        }
        #s-up { grid-column: 2; grid-row: 1; }
        #s-left { grid-column: 1; grid-row: 2; }
        #s-right { grid-column: 3; grid-row: 2; }
        #s-down { grid-column: 2; grid-row: 3; }

        .status-txt {
            margin-bottom: 15px;
            font-weight: bold;
            color: var(--primary);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">repozz</div>
        <div class="subtitle">Arcade Lobby</div>
    </header>

    <!-- Menu de seleção de jogos -->
    <div class="lobby">
        <button class="lobby-btn active" onclick="switchGame('snake')">🐍 Cobrinha</button>
        <button class="lobby-btn" onclick="switchGame('damas')">🔴 Damas</button>
        <button class="lobby-btn" onclick="switchGame('xadrez')">👑 Xadrez</button>
    </div>

    <div class="game-stage">
        
        <!-- JOGO 1: COBRINHA -->
        <div id="game-snake" class="game-window active">
            <div class="status-txt">Pontos: <span id="snake-score">0</span></div>
            <canvas id="snakeCanvas" width="360" height="360"></canvas>
            <div class="snake-ctrls">
                <button class="s-btn" id="s-up">↑</button>
                <button class="s-btn" id="s-left">←</button>
                <button class="s-btn" id="s-right">→</button>
                <button class="s-btn" id="s-down">↓</button>
            </div>
        </div>

        <!-- JOGO 2: DAMAS -->
        <div id="game-damas" class="game-window">
            <div class="status-txt" id="damas-status">Vez das Vermelhas</div>
            <div id="damasBoard" class="board"></div>
        </div>

        <!-- JOGO 3: XADREZ -->
        <div id="game-xadrez" class="game-window">
            <div class="status-txt" id="xadrez-status">Vez das Brancas</div>
            <div id="xadrezBoard" class="board"></div>
        </div>

    </div>

    <script>
        // --- LÓGICA DO LOBBY ---
        function switchGame(gameId) {
            document.querySelectorAll('.game-window').forEach(w => w.classList.remove('active'));
            document.querySelectorAll('.lobby-btn').forEach(b => b.classList.remove('active'));
            
            document.getElementById(`game-${gameId}`).classList.add('active');
            event.target.classList.add('active');

            if(gameId === 'snake') resetSnake();
            if(gameId === 'damas') initDamas();
            if(gameId === 'xadrez') initXadrez();
        }

        // --- CODE 1: COBRINHA (SNAKE) ---
        const sCanvas = document.getElementById("snakeCanvas");
        const sCtx = sCanvas.getContext("2d");
        const sSize = 20;
        const sCount = sCanvas.width / sSize;
        let snake, food, sdx, sdy, sScore, sInterval;

        function resetSnake() {
            snake = [{x: 9, y: 9}]; food = {x: 4, y: 4};
            sdx = 1; sdy = 0; sScore = 0;
            document.getElementById("snake-score").innerText = sScore;
            clearInterval(sInterval);
            sInterval = setInterval(updateSnake, 120);
        }
        function updateSnake() {
            const head = {x: snake[0].x + sdx, y: snake[0].y + sdy};
            if(head.x<0 || head.x>=sCount || head.y<0 || head.y>=sCount) return resetSnake();
            for(let i=0; i<snake.length; i++) if(snake[i].x===head.x && snake[i].y===head.y) return resetSnake();
            
            snake.unshift(head);
            if(head.x===food.x && head.y===food.y) {
                sScore += 10; document.getElementById("snake-score").innerText = sScore;
                food = {Math: Math.floor(Math.random()*sCount), y: Math.floor(Math.random()*sCount)};
            } else { snake.pop(); }

            sCtx.fillStyle = "#000"; sCtx.fillRect(0,0,sCanvas.width,sCanvas.height);
            sCtx.fillStyle = "#00ff88"; snake.forEach(p => sCtx.fillRect(p.x*sSize, p.y*sSize, sSize-1, sSize-1));
            sCtx.fillStyle = "#ff4444"; sCtx.fillRect(food.x*sSize, food.y*sSize, sSize-1, sSize-1);
        }
        document.addEventListener("keydown", e => {
            if(e.key==="ArrowUp" && sdy===0) { sdx=0; sdy=-1; }
            if(e.key==="ArrowDown" && sdy===0) { sdx=0; sdy=1; }
            if(e.key==="ArrowLeft" && sdx===0) { sdx=-1; sdy=0; }
            if(e.key==="ArrowRight" && sdx===0) { sdx=1; sdy=0; }
        });
        document.getElementById("s-up").onclick = () => { if(sdy===0) { sdx=0; sdy=-1; } };
        document.getElementById("s-down").onclick = () => { if(sdy===0) { sdx=0; sdy=1; } };
        document.getElementById("s-left").onclick = () => { if(sdx===0) { sdx=-1; sdy=0; } };
        document.getElementById("s-right").onclick = () => { if(sdx===0) { sdx=1; sdy=0; } };


        // --- CODE 2: DAMAS SIMPLE ---
        let dBoard = [], dTurn = 'red', dSelected = null;
        function initDamas() {
            const b = document.getElementById("damasBoard"); b.innerHTML = "";
